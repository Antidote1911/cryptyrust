# Builds Cryptyrust for Linux, macOS and Windows and publishes the files in a GitHub release.
#
#   git tag v3.1.0 && git push origin v3.1.0   builds, then creates the release "v3.1.0"
#   "Run workflow" button (Actions tab)        builds only: the files are kept as artifacts of
#                                              the run and named after the version of Cargo.toml,
#                                              no release is created
#
# Linux: an AppImage, a Debian package (the same program in /usr/bin) and a Flatpak bundle
# (built from packaging/flatpak/, on the freedesktop runtime).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux AppImage ─────────────────────────────────────────────────────────
  build-linux:
    name: Build – Linux x86_64 (AppImage)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        # The tag; for a run started by hand, the version of Cargo.toml
        run: |
          v="${{ github.ref_name }}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            v=${v#v}
          else
            v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VERSION=$v" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build release binaries
        run: cargo build --release

      - name: Download linuxdeploy
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" \
            -O linuxdeploy
          chmod +x linuxdeploy

      - name: Build AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OUTPUT: cryptyrust-${{ steps.version.outputs.VERSION }}-linux.AppImage
        run: |
          ./linuxdeploy \
            --appdir AppDir \
            --executable target/release/cryptyrust \
            --desktop-file packaging/linux/cryptyrust.desktop \
            --icon-file packaging/cryptyrust.png \
            --output appimage

      - name: Build the Debian package
        # The program in /usr/bin, as it is: it carries no library of its own. The glibc it
        # needs is read from the program, so the package says so on older systems.
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          root=deb/cryptyrust
          install -Dm755 target/release/cryptyrust -t $root/usr/bin
          strip --strip-unneeded $root/usr/bin/cryptyrust
          install -Dm644 packaging/linux/cryptyrust.desktop -t $root/usr/share/applications
          install -Dm644 packaging/linux/io.github.antidote1911.cryptyrust.metainfo.xml -t $root/usr/share/metainfo
          install -Dm644 packaging/cryptyrust.png -t $root/usr/share/icons/hicolor/512x512/apps
          install -Dm644 README.md arsenic/FORMAT.md -t $root/usr/share/doc/cryptyrust
          install -Dm644 cryptyrust/README.md $root/usr/share/doc/cryptyrust/USAGE.md
          install -Dm644 LICENSE $root/usr/share/doc/cryptyrust/copyright
          chmod -R u=rwX,go=rX $root
          glibc=$(objdump -T $root/usr/bin/cryptyrust | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          mkdir -p $root/DEBIAN
          sed -e "s/{VERSION}/$VERSION/" -e "s/{GLIBC}/${glibc#GLIBC_}/" \
              -e "s/{SIZE}/$(du -sk $root | cut -f1)/" packaging/debian/control > $root/DEBIAN/control
          dpkg-deb --root-owner-group -Zxz --build $root "cryptyrust_${VERSION}_amd64.deb"
          dpkg-deb --info "cryptyrust_${VERSION}_amd64.deb"

      - name: Check the Debian package
        # Installed for real, the program run, then removed.
        run: |
          sudo apt-get install -y ./cryptyrust_*_amd64.deb
          timeout 120 cryptyrust --version
          test -f /usr/share/applications/cryptyrust.desktop
          sudo apt-get remove -y cryptyrust
          test ! -e /usr/bin/cryptyrust

      - uses: actions/upload-artifact@v4
        with:
          name: cryptyrust-linux-appimage
          path: cryptyrust-${{ steps.version.outputs.VERSION }}-linux.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: cryptyrust-linux-deb
          path: cryptyrust_${{ steps.version.outputs.VERSION }}_amd64.deb
          if-no-files-found: error

  # ── Linux Flatpak ──────────────────────────────────────────────────────────
  build-flatpak:
    name: Build – Linux x86_64 (Flatpak)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08 # the runtime of the manifest
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        # The tag; for a run started by hand, the version of Cargo.toml
        run: |
          v="${{ github.ref_name }}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            v=${v#v}
          else
            v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VERSION=$v" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: cryptyrust-${{ steps.version.outputs.VERSION }}-linux.flatpak
          manifest-path: packaging/flatpak/io.github.antidote1911.cryptyrust.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Check that the program starts
        # In the folder the action has just built (flatpak_app), with the rights of the manifest.
        # Not blocking: inside this container the sandbox itself does not always start (no
        # session bus), which says nothing about the bundle. Look at the result of the step.
        continue-on-error: true
        run: |
          dbus-run-session -- flatpak-builder --disable-rofiles-fuse --run flatpak_app \
              packaging/flatpak/io.github.antidote1911.cryptyrust.yml cryptyrust --version

      - uses: actions/upload-artifact@v4
        with:
          name: cryptyrust-linux-flatpak
          path: cryptyrust-${{ steps.version.outputs.VERSION }}-linux.flatpak
          if-no-files-found: error

  # ── macOS Universal DMG ────────────────────────────────────────────────────
  build-macos:
    name: Build – macOS Universal (DMG)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        # The tag; for a run started by hand, the version of Cargo.toml
        run: |
          v="${{ github.ref_name }}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            v=${v#v}
          else
            v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VERSION=$v" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/cryptyrust \
            target/aarch64-apple-darwin/release/cryptyrust \
            -output dist/cryptyrust

      - name: PNG → .icns (outils natifs macOS)
        run: |
          mkdir -p cryptyrust.iconset
          sips -z 16   16   packaging/cryptyrust.png --out cryptyrust.iconset/icon_16x16.png
          sips -z 32   32   packaging/cryptyrust.png --out cryptyrust.iconset/icon_16x16@2x.png
          sips -z 32   32   packaging/cryptyrust.png --out cryptyrust.iconset/icon_32x32.png
          sips -z 64   64   packaging/cryptyrust.png --out cryptyrust.iconset/icon_32x32@2x.png
          sips -z 128  128  packaging/cryptyrust.png --out cryptyrust.iconset/icon_128x128.png
          sips -z 256  256  packaging/cryptyrust.png --out cryptyrust.iconset/icon_128x128@2x.png
          sips -z 256  256  packaging/cryptyrust.png --out cryptyrust.iconset/icon_256x256.png
          sips -z 512  512  packaging/cryptyrust.png --out cryptyrust.iconset/icon_256x256@2x.png
          sips -z 512  512  packaging/cryptyrust.png --out cryptyrust.iconset/icon_512x512.png
          cp cryptyrust.iconset/icon_512x512.png cryptyrust.iconset/icon_512x512@2x.png
          iconutil -c icns cryptyrust.iconset -o cryptyrust.icns

      - name: Create .app bundle
        run: |
          mkdir -p "Cryptyrust.app/Contents/MacOS"
          mkdir -p "Cryptyrust.app/Contents/Resources"
          cp dist/cryptyrust   "Cryptyrust.app/Contents/MacOS/cryptyrust"
          cp cryptyrust.icns   "Cryptyrust.app/Contents/Resources/cryptyrust.icns"
          sed "s/\$(MARKETING_VERSION)/${{ steps.version.outputs.VERSION }}/g" \
            packaging/macos/Info.plist > "Cryptyrust.app/Contents/Info.plist"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          mkdir dmg-staging
          cp -r "Cryptyrust.app" dmg-staging/
          create-dmg \
            --volname "Cryptyrust" \
            --volicon "cryptyrust.icns" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --icon "Cryptyrust.app" 180 170 \
            --hide-extension "Cryptyrust.app" \
            --app-drop-link 480 170 \
            "cryptyrust-${{ steps.version.outputs.VERSION }}-macos-universal.dmg" \
            "dmg-staging/"

      - uses: actions/upload-artifact@v4
        with:
          name: cryptyrust-macos-dmg
          path: cryptyrust-${{ steps.version.outputs.VERSION }}-macos-universal.dmg

  # ── Windows portable + installer ──────────────────────────────────────────
  build-windows:
    name: Build – Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build release binaries
        run: cargo build --release

      - name: Get version
        id: version
        shell: pwsh
        # The tag; for a run started by hand, the version of Cargo.toml
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\cryptyrust.exe dist\
          Compress-Archive -Path dist\* -DestinationPath "cryptyrust-${{ steps.version.outputs.VERSION }}-win-portable.zip"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          Copy-Item target\release\cryptyrust.exe      packaging\windows\
          Copy-Item cryptyrust\assets\icon.ico         packaging\windows\
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVERSION=${{ steps.version.outputs.VERSION }} packaging\windows\installer.iss
          Move-Item packaging\windows\Output\cryptyrust-windows-setup.exe "cryptyrust-${{ steps.version.outputs.VERSION }}-win-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: cryptyrust-windows-portable
          path: cryptyrust-${{ steps.version.outputs.VERSION }}-win-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cryptyrust-windows-setup
          path: cryptyrust-${{ steps.version.outputs.VERSION }}-win-setup.exe

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-flatpak, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        # The tag; for a run started by hand, the version of Cargo.toml
        run: |
          v="${{ github.ref_name }}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            v=${v#v}
          else
            v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VERSION=$v" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cryptyrust-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cryptyrust-${{ steps.version.outputs.VERSION }}-linux.AppImage
            cryptyrust-${{ steps.version.outputs.VERSION }}-linux.flatpak
            cryptyrust_${{ steps.version.outputs.VERSION }}_amd64.deb
            cryptyrust-${{ steps.version.outputs.VERSION }}-macos-universal.dmg
            cryptyrust-${{ steps.version.outputs.VERSION }}-win-portable.zip
            cryptyrust-${{ steps.version.outputs.VERSION }}-win-setup.exe
            arsenic/FORMAT.md
            arsenic/FORMAT.html
            arsenic/algos_list.md
            README.md
          generate_release_notes: true
